<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annoying Web Blocker</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #f2f2f7; color: #1d1d1f; }
    main { width: min(620px, calc(100% - 32px)); margin: 48px auto; }
    .card { background: #fff; border: 1px solid #d8d8dc; border-radius: 16px; padding: 28px; box-shadow: 0 10px 30px #0000000d; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle, .hint { color: #666; }
    .status { margin: 20px 0; padding: 12px 14px; border-radius: 10px; background: #edf6ff; }
    .status.active { background: #fff0f0; color: #9d1010; }
    label { display: block; font-weight: 600; margin: 18px 0 7px; }
    .toggle { display: flex; gap: 10px; align-items: center; }
    .toggle input { width: 18px; height: 18px; }
    .times { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    input[type=time], textarea { box-sizing: border-box; width: 100%; border: 1px solid #b8b8bd; border-radius: 9px; padding: 10px 12px; font: inherit; background: transparent; color: inherit; }
    textarea { min-height: 150px; resize: vertical; }
    button { margin-top: 20px; width: 100%; border: 0; border-radius: 10px; padding: 12px 16px; background: #1769e0; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 22px; margin: 12px 0 0; color: #b42318; }
    @media (prefers-color-scheme: dark) {
      body { background: #151517; color: #f5f5f7; }
      .card { background: #202024; border-color: #3c3c42; }
      .subtitle, .hint { color: #aaa; }
      .status { background: #183047; }
      .status.active { background: #4a2020; color: #ffb4b4; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Annoying Web Blocker</h1>
      <p class="subtitle">A recurring daily block enforced through your Mac’s hosts file.</p>
      <div id="status" class="status">Loading…</div>
      <form id="settings">
        <label class="toggle"><input id="enabled" type="checkbox"> Enable daily blocking</label>
        <div class="times">
          <div><label for="start">Start time</label><input id="start" type="time" required></div>
          <div><label for="end">End time</label><input id="end" type="time" required></div>
        </div>
        <label for="domains">Domains</label>
        <textarea id="domains" spellcheck="false" placeholder="youtube.com&#10;reddit.com"></textarea>
        <p class="hint">Enter one exact domain per line. Add subdomains such as www.example.com separately; wildcard domains are not supported.</p>
        <button id="save" type="submit">Save schedule</button>
        <p id="message" role="alert"></p>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
